<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="180" height="180" rx="36" fill="#0A0A0A"/>

  <!-- Left pillar -->
  <rect x="14" y="40" width="44" height="108" fill="white"/>

  <!-- Left hump diagonal wedge -->
  <polygon points="58,40 58,78 90,56 90,40" fill="white"/>

  <!-- Right hump — curved outer shape -->
  <path d="M90 40 L90 56 C106 66 122 74 122 92 L122 148 L166 148 L166 72 C166 52 148 40 130 40 Z" fill="white"/>

  <!-- Circular negative cutout (white space where link lives) -->
  <circle cx="90" cy="88" r="26" fill="#0A0A0A"/>

  <!-- Link icon: diagonal line + two circles -->
  <line x1="74" y1="103" x2="107" y2="72" stroke="white" stroke-width="8" stroke-linecap="round"/>
  <circle cx="74"  cy="103" r="9" fill="white"/>
  <circle cx="107" cy="72"  r="9" fill="white"/>
</svg>
